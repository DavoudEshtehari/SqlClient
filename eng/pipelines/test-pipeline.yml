name: $(Year:YY)$(DayOfYear)$(Rev:.rr)


parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false

- name: configProperties
  type: object
  default: {}
  #   TCPConnectionString: $(SQL_TCP_CONN_STRING)
  #   NPConnectionString: $(SQL_NP_CONN_STRING)
  #   AADAuthorityURL: $(AADAuthorityURL)

- name: testArray
  type: object
  default: [] #[1, 2, 3]

# - name: testCfgs
#   type: object
#   default:
#     windows-sql:
#       pool: ADO-1ES-Pool
#       images:
#           Windows22-Sql19: ADO-MMS22-SQL19
#           Windows22-Sql22: ADO-MMS22-SQL22
#       targetFrameworks: [net462, net6.0, net8.0]
#       targetFrameworks-ManagedSNI: [net6.0, net8.0]
#       buildPlatforms: [AnyCPU]
#       testPlatforms: [AnyCPU, x86]
#       testSets: [1, 2, 3]
#       connectionStrings:
#         TCPConnectionString: $(SQL_TCP_CONN_STRING)
#         NPConnectionString: $(SQL_NP_CONN_STRING)
#         AADAuthorityURL: $(AADAuthorityURL)

variables:
  - template: libraries/ci-build-variables.yml

  - name: artifactName
    value: Artifacts

  - name: defaultPoolName
    value: 'Azure Pipelines'

  - name: AADAuthorityURL
    value: 'https://login.windows.net/72F988BF-86F1-41AF-91AB-2D7CD011DB47/'

extends:
  template: common/templates/stages/ci-run-tests-stage.yml
  parameters:
    # dependsOn: 'build'
    debug: ${{ parameters.debug }}
    prebuildSteps:
      - script: SET
        displayName: 'Print Environment Variables'
      - task: DownloadPipelineArtifact@2
        displayName: 'Download NuGet Package'
        inputs:
          buildType: specific
          project: 'ADO.Net'
          definition: 1825 
          artifact: $(artifactName)
          patterns: '**/*.nupkg'
          targetPath: $(Pipeline.Workspace)/$(artifactName)

    testConfigurations:
      windows_sql:
        pool: $(defaultPoolName)
        images:
          Windows22_Sql19: windows-latest
          Windows22_Sql22: windows-latest
        TargetFrameworks: [net462, net6.0, net8.0]
        TFwithManagedSNI: [net6.0, net8.0]
        buildPlatforms: [AnyCPU]
        testPlatforms: [AnyCPU, x86]
        testSets: [1, 2, 3]
        configProperties:
          TCPConnectionString: '$(SQL_TCP_CONN_STRING)'
          NPConnectionString: '$(SQL_NP_CONN_STRING)'
          AADAuthorityURL: '$(AADAuthorityURL)'

