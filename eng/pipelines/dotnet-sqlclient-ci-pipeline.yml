name: $(DayOfYear)$(Rev:rr)
trigger: none
  # branches:
  #   include:
  #   - internal/main
  # paths:
  #   include:
  #   - src
  #   - eng
  #   - tools
  #   - .config
  #   - build.proj
  #   - Nuget.config
  #   - '*.cmd'
  #   - '*.sh'

# schedules:
# - cron: '30 4 * * Mon'
#   displayName: Weekly Sunday 9:30 PM (UTC - 7) Build
#   branches:
#     include:
#     - internal/main
#   always: true

# - cron: '30 3 * * Mon-Fri'
#   displayName: Mon-Fri 8:30 PM (UTC - 7) Build
#   branches:
#     include:
#     - internal/main

parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: false

variables:
  - name: artifactName
    value: Artifacts

stages:
- stage: build
  jobs:
  - template: common/templates/jobs/build-nugets-ci-job.yml
    parameters:
      artifactName: $(artifactName)

- stage: test_windows2022
  dependsOn: build
  jobs:
  - template: common/templates/jobs/run-tests-ci-job.yml
    parameters:
      poolName: ADO-1ES-Pool
      jobDisplayName: 'Win 2022 SQL 2019'
      imageOverride: ADO-MMS22-SQL19
      configProperties:
        - TCPConnectionString: $(SQL_TCP_CONN_STRING)
        - NPConnectionString: $(SQL_NP_CONN_STRING)
        - AADAuthorityURL: $(AADAuthorityURL)
