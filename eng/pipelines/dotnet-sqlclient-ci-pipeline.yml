            # databaseName: default: Northwind
            # localDbAppName: default: $(LocalDbAppName)
            # localDbSharedInstanceName: default: $(LocalDbSharedInstanceName)
            # skipSqlConfiguration: # skips the SQL configuration step

        windows_sql_22: 
          pool: $(defaultPoolName)
