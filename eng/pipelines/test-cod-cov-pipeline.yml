name: $(DayOfYear)$(Rev:rr)
parameters: # parameters are shown up in ADO UI in a build queue time
- name: 'debug'
  displayName: 'Enable debug output'
  type: boolean
  default: true

- name: codeCovTargetFrameworks
  displayName: 'Code Coverage Target Frameworks'
  type: object
  default: [net462, net6.0]

- name: definitionId
  displayName: 'Source Pipeline definition Id'
  type: number
  default: 1825

- name: buildVersionToDownload
  displayName: 'Build version to download'
  type: string
  default: 'latest'

- name: buildId
  displayName: 'Build Id'
  type: number
  default: 0

variables:
  - name: defaultHostedPoolName
    value: 'Azure Pipelines'

resources:
  repositories:
    - repository: sqlclient
      type: github
      name: dotnet/SqlClient
      ref: refs/heads/main

stages:
- stage: build
  displayName: 'Build NuGet Packages'
  jobs:
  - template: common/templates/jobs/ci-code-coverage-job.yml
    parameters:
      poolName: $(defaultHostedPoolName)
      image: 'windows-2022'
      debug: ${{ parameters.debug }}
      Upload: false
      downloadArtifactsSteps:
        - ${{ each targetFramework in parameters.codeCovTargetFrameworks }}:
          - task: DownloadPipelineArtifact@2
            displayName: 'Download Coverage Reports [${{ targetFramework }}]'
            inputs:
              buildType: specific
              project: 'ADO.Net'
              definition: ${{ parameters.definitionId }}
              ${{ if ne(parameters.buildId, 0) }}:
                pipelineId: ${{ parameters.buildId }}
              buildVersionToDownload: ${{ parameters.buildVersionToDownload }}
              allowPartiallySucceededBuilds: true
              allowFailedBuilds: true
              itemPattern: '**\${{ targetFramework }}*'
              ${{ if contains(targetFramework, 'net4') }}:
                targetPath: '$(Build.SourcesDirectory)\coverageNetFx'
              ${{ else }}:
                targetPath: '$(Build.SourcesDirectory)\coverageNetCore'
