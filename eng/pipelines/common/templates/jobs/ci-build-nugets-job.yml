parameters:
  - name: poolName
    type: string
    default: ADO-1ES-Pool

  - name: imageOverride
    type: string
    default: ADO-MMS22-SQL19

  - name: artifactName
    type: string
    default: Artifacts

  - name: prebuildSteps
    type: stepList
    default: []

jobs:
- job: build_nugets

  pool:
    name: ${{parameters.poolName }}
    demands:
    - imageOverride -equals ${{ parameters.imageOverride }}
    - msbuild

  variables:
    - template: ../../../libraries/ci-build-variables.yml

  steps:
  - ${{ if ne(parameters.prebuildSteps, '') }}:
    - ${{ parameters.prebuildSteps }} # extra steps to run before the build like downloading sni and the required configuration

  - task: MSBuild@1
    displayName: 'Restore nugets'
    inputs:
      solution: build.proj
      msbuildArchitecture: x64
      msbuildArguments: '-t:restore'

  - task: MSBuild@1
    displayName: 'Build Driver'
    inputs:
      solution: build.proj
      msbuildArchitecture: x64
      platform: '$(Platform)'
      configuration: '$(Configuration)'
      msbuildArguments: '-t:BuildAllConfigurations -p:GenerateNuGet=false -p:BuildNumber=$(BuildNumber)'
      clean: true

  - task: MSBuild@1
    displayName: 'Build AKV Provider NetFx'
    inputs:
      solution: build.proj
      msbuildArchitecture: x64
      platform: '$(Platform)'
      configuration: '$(Configuration)'
      msbuildArguments: '-t:BuildAKVNetFx -p:BuildNumber=$(BuildNumber)'

  - task: MSBuild@1
    displayName: 'Build AKV Provider NetCore All OS'
    inputs:
      solution: build.proj
      msbuildArchitecture: x64
      platform: '$(Platform)'
      configuration: '$(Configuration)'
      msbuildArguments: '-t:BuildAKVNetCoreAllOS -p:BuildNumber=$(BuildNumber)'

  - task: NuGetToolInstaller@1
    displayName: 'Use NuGet'
    inputs:
      checkLatest: true

  - task: NuGetCommand@2
    displayName: 'NuGet pack M.D.SqlClient'
    inputs:
      command: pack
      packagesToPack: tools/specs/Microsoft.Data.SqlClient.nuspec
      configuration: '$(Configuration)'
      versioningScheme: byEnvVar
      versionEnvVar: NugetPackageVersion

  - task: NuGetCommand@2
    displayName: 'NuGet pack AKV Provider'
    inputs:
      command: pack
      packagesToPack: 'tools/specs/add-ons/Microsoft.Data.SqlClient.AlwaysEncrypted.AzureKeyVaultProvider.nuspec'
      configuration: '$(Configuration)'
      versioningScheme: byEnvVar
      versionEnvVar: NugetPackageVersion
      buildProperties: 'ReferenceType=Project'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact: Artifacts'
    inputs:
      ArtifactName: ${{ parameters.artifactName }}
