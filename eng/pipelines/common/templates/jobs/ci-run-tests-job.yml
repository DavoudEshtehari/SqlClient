parameters:
  - name: debug
    type: boolean
    default: false

  - name: poolName
    type: string
    default: ADO-1ES-Pool

  - name: imageOverride
    type: string
    default: ADO-MMS22-SQL19

  - name: jobDisplayName
    type: string

  - name: configProperties
    type: object
    default: {} # - key: 'value'

  - name: prebuildSteps
    type: stepList
    default: []

  - name: artifactName
    type: string
    default: Artifacts

jobs:
- job: ${{ format('{0}', coalesce(parameters.jobDisplayName, parameters.imageOverride, 'unknown_image')) }}

  pool: 
    vmImage: ${{ parameters.imageOverride }} # <<<<< temporary for testing >>>>>
    # name: ${{parameters.poolName }}
    # demands:
    # - imageOverride -equals ${{ parameters.imageOverride }}

  steps:
    - ${{ if ne(parameters.prebuildSteps, '') }}:
      - ${{ parameters.prebuildSteps }} # extra steps to run before the build like downloading sni and the required configuration

    - pwsh: |
        Write-Host "configProperties['TCPConnectionString']: ${{ parameters.configProperties['TCPConnectionString'] }}"
        Write-Host "configProperties['NPConnectionString']: ${{ parameters.configProperties['NPConnectionString'] }}"
        Write-Host "configProperties['AADAuthorityURL']: ${{ parameters.configProperties['AADAuthorityURL'] }}"
      displayName: 'Print configProperties'

    - ${{ if ne(parameters.configProperties, '{}') }}:
      - template: ../steps/update-config-file-step.yml
        parameters:
          debug: ${{ parameters.debug }}
          TCPConnectionString: ${{ parameters.configProperties['TCPConnectionString'].value }}
          NPConnectionString: ${{ parameters.configProperties['NPConnectionString'].value }}
          AADAuthorityURL: ${{ parameters.configProperties['AADAuthorityURL'].value }}
          AADClientId: ${{ parameters.configProperties['AADClientId'].value }}
          AADClientSecret: ${{ parameters.configProperties['AADClientSecret'].value }}
          AADTenantId: ${{ parameters.configProperties['AADTenantId'].value }}
