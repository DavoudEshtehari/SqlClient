parameters:
  - name: debug
    type: boolean
    default: false

  - name: poolName
    type: string
    default: ADO-1ES-Pool

  - name: imageOverride
    type: string
    default: ADO-MMS22-SQL19

  - name: jobDisplayName
    type: string

  - name: configProperties
    type: object
    default: {} # - key: 'value'

  - name: prebuildSteps
    type: stepList
    default: []

  - name: artifactName
    type: string
    default: Artifacts

jobs:
- job: ${{ format('{0}', coalesce(parameters.jobDisplayName, parameters.imageOverride, 'unknown_image')) }}

  pool: 
    vmImage: ${{ parameters.imageOverride }} # <<<<< temporary for testing >>>>>
    # name: ${{parameters.poolName }}
    # demands:
    # - imageOverride -equals ${{ parameters.imageOverride }}

  steps:
    - ${{ if ne(parameters.prebuildSteps, '') }}:
      - ${{ parameters.prebuildSteps }} # extra steps to run before the build like downloading sni and the required configuration

    - ${{ if ne(parameters.configProperties, '{}') }}:
      - template: ../steps/update-config-file-step.yml
        parameters:
          debug: ${{ parameters.debug }}
          ${{ if parameters.configProperties.TCPConnectionString }}:
            TCPConnectionString: ${{ parameters.configProperties.TCPConnectionString }}
          ${{ if parameters.configProperties.NPConnectionString }}:
            NPConnectionString: ${{ parameters.configProperties.NPConnectionString }}
          ${{ if parameters.configProperties.AADAuthorityURL }}:
            AADAuthorityURL: ${{ parameters.configProperties.AADAuthorityURL }}
          ${{ if parameters.configProperties.AADClientId }}:
            AADClientId: ${{ parameters.configProperties.AADClientId }}
          ${{ if parameters.configProperties.AADClientSecret }}:
            AADClientSecret: ${{ parameters.configProperties.AADClientSecret }}
          ${{ if parameters.configProperties.AADTenantId }}:
            AADTenantId: ${{ parameters.configProperties.AADTenantId }}
