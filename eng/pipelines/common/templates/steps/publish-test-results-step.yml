parameters:
  - name: targetFramework
    type: string

  - name: platform
    type: string
    default: $(Platform)

  - name: configuration
    type: string
    default: '$(Configuration)'

steps:
- task: PublishTestResults@2
  displayName: 'Publish Test Results [Win]'
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: 'TestResults/*.trx'
    mergeTestResults: true
    testRunTitle: 'Windows Tests'
    buildPlatform: '${{parameters.platform }}'
    buildConfiguration: '${{parameters.configuration }}'
  condition: and(succeededOrFailed(), eq(variables['Agent.OS'], 'Windows_NT'))

- task: PublishTestResults@2
  displayName: 'Publish Test Results [Non-Win]'
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: |
     TestResults/*.trx
     TestResults/**/*.coverage
    mergeTestResults: true
    testRunTitle: 'Linux Tests'
    buildPlatform: '${{parameters.platform }}'
    buildConfiguration: '${{parameters.configuration }}'
  condition: and(succeededOrFailed(), ne(variables['Agent.OS'], 'Windows_NT'))

- pwsh: |
   cd TestResults
   Get-ChildItem -Filter “*.coverage” -Recurse | Rename-Item -NewName {"${{parameters.targetFramework }}" + $_.name} 
  displayName: 'Rename coverage files'

- task: PublishPipelineArtifact@1
  displayName: 'Publish Pipeline Artifact'
  inputs:
    targetPath: TestResults
    artifact: '${{parameters.targetFramework }}WinAz$(System.JobId)'
  condition: succeededOrFailed()
