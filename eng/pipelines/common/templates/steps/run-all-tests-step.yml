parameters:
  - name: debug
    type: boolean
    default: false

  - name: targetFramework
    type: string

  - name: nugetPackageVersion
    type: string
    default: $(NugetPackageVersion)

  - name: platform
    type: string
    default: $(Platform)
  
  - name: configuration
    type: string
    default: '$(Configuration)'

  - name: referenceType
    default: Package
    values:
      - Project
      - Package

  - name: testSet
    type: string

steps:
- ${{ if parameters.debug }}:
  - powershell: 'dotnet sdk check'
    displayName: '.NET sdk check'
    condition: succeededOrFailed()

- task: MSBuild@1
  displayName: 'Run Functional Tests ${{parameters.targetFramework }}'
  inputs:
    solution: build.proj
    msbuildArchitecture: x64
    platform: '${{parameters.platform }}'
    configuration: '${{parameters.configuration }}'
    msbuildArguments: '-t:RunFunctionalTests -p:TF=${{parameters.targetFramework }} -p:TestSet=${{parameters.testSet }} -p:ReferenceType=${{parameters.referenceType }} -p:TestMicrosoftDataSqlClientVersion=${{parameters.nugetPackageVersion }}'
  condition: succeeded()
  retryCountOnTaskFailure: 1

- task: MSBuild@1
  displayName: 'Run Manual Tests ${{parameters.targetFramework }}'
  inputs:
    solution: build.proj
    msbuildArchitecture: x64
    platform: '${{parameters.platform }}'
    configuration: '${{parameters.configuration }}'
    msbuildArguments: '-t:RunManualTests -p:TF=${{parameters.targetFramework }} -p:TestSet=${{parameters.testSet }} -p:ReferenceType=${{parameters.referenceType }} -p:TestMicrosoftDataSqlClientVersion=${{parameters.nugetPackageVersion }}'
  condition: succeeded()
  retryCountOnTaskFailure: 2
